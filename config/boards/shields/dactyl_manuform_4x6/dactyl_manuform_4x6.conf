# --- Comms -------------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Room for up to 5 paired hosts + 1 peripheral link (default is much smaller)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# --- Battery -----------------------------------------------------------
# Report battery percentage over BLE HID to the host
CONFIG_ZMK_BATTERY_REPORTING=y

# Central polls the peripheral for its battery and exposes both in the
# host's BLE battery service (so your OS shows both halves)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Power / sleep -----------------------------------------------------
# Enter deep sleep after 15 min idle; keypress wakes.
# On nice!nano v2 in deep sleep the board draws ~15 uA, so this is what
# makes battery life measured in weeks instead of days.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- ZMK Studio --------------------------------------------------------
# Enables live keymap editing via https://zmk.studio (over USB).
# Keyboard is locked by default; press &studio_unlock (on ADJUST) to allow
# Studio-initiated changes. Auto-locks after inactivity.
CONFIG_ZMK_STUDIO=y

# --- Hardware quirks ---------------------------------------------------
# Free up P0.09 (D10 on nice!nano v2) from NFC mode so it works as GPIO.
# Writes UICR at boot; sticky across reflashes until UICR erase.
CONFIG_NFCT_PINS_AS_GPIOS=y
